spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/local_food}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:local_food}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local_food}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:change-me-now}
app.security.admin.totp-secret=${ADMIN_TOTP_SECRET:123456}

app.features.cod-enabled=${FEATURE_COD_ENABLED:true}
app.features.payments-enabled=${FEATURE_PAYMENTS_ENABLED:false}
app.features.sms-otp-enabled=${FEATURE_SMS_OTP_ENABLED:false}
app.features.whatsapp-enabled=${FEATURE_WHATSAPP_ENABLED:false}

app.order.currency=${APP_ORDER_CURRENCY:INR}
app.order.delivery-fee-paise=${APP_ORDER_DELIVERY_FEE_PAISE:3000}

app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:./data/uploads}
app.media.public-base-path=${APP_MEDIA_PUBLIC_BASE_PATH:/media}

app.customer.session-days=${APP_CUSTOMER_SESSION_DAYS:30}
app.push.enabled=${APP_PUSH_ENABLED:true}
app.push.fcm.service-account-json-base64=${APP_PUSH_FCM_SERVICE_ACCOUNT_JSON_BASE64:}
app.push.fcm.android-channel-id=${APP_PUSH_FCM_ANDROID_CHANNEL_ID:orders-updates}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,http://localhost:19006,http://127.0.0.1:19006,http://192.168.*:*,http://10.*:*, https://*.ngrok-free.app}

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB
