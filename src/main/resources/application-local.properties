spring.datasource.url=jdbc:h2:file:${LOCAL_FOOD_DATA_DIR}/local_food;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.features.cod-enabled=true
app.features.payments-enabled=false
app.features.sms-otp-enabled=false
app.features.whatsapp-enabled=false
app.push.enabled=false