spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.features.cod-enabled=true
app.features.payments-enabled=false
app.features.sms-otp-enabled=false
app.features.whatsapp-enabled=false
app.order.currency=INR
app.order.delivery-fee-paise=3000

app.security.admin.username=admin
app.security.admin.password=admin-pass
app.security.admin.totp-secret=654321

app.media.upload-dir=./target/test-uploads
app.media.public-base-path=/media
app.customer.session-days=30
app.push.enabled=false
app.push.fcm.service-account-json-base64=
app.push.fcm.android-channel-id=orders-updates
